<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Polo Patronium (PATRON) — Stewardship Token of the USPPA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Woodcut-style serif fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=IM+Fell+English+SC&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #050505;
      --bg-inner: #111111;
      --fg: #f5f5f5;
      --muted: #b5b5b5;
      --accent: #d9a85a;
      --border: #3a3a3a;
      --border-strong: #77716a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #202020 0, #050505 55%);
      color: var(--fg);
      font-family: "IM Fell English", Georgia, "Times New Roman", serif;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 48px 0;              /* more vertical breathing */
    }

    .page {
      max-width: 720px;
      width: 100%;
      margin: 0 12px;
      padding: 48px 24px 64px;       /* taller page interior */
      background: var(--bg-inner);
      border: 2px solid var(--border-strong);
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    .content-inner {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    /* Masthead */
    .masthead {
      margin-bottom: 48px;   /* more space above hero */
      text-align: center;
    }

    .masthead-line-1 {
      font-family: "IM Fell English SC", "IM Fell English", serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.9rem;
      color: #ffffff;                            /* brighter */
      text-shadow: 0 0 12px rgba(255,255,255,0.35);
    }

    .masthead-rule {
      margin: 10px auto 12px;
      width: 70%;
      border-top: 2px solid var(--border-strong);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      height: 5px;
    }

    .masthead-line-2 {
      font-family: "IM Fell English SC", "IM Fell English", serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.86rem;
      color: #f7f7f7;                            /* brighter */
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    header {
      margin-bottom: 40px;
      flex: 1 0 auto;
      display: flex;
      align-items: stretch;
    }

    .hero-poster {
      padding: 80px 26px 80px;   /* triple-ish height inside hero */
      margin-top: 0;
      border-radius: 0;
      border: 2px solid var(--border-strong);
      background: radial-gradient(circle at top, #232323 0, #101010 70%);
      text-align: center;
      position: relative;
      box-shadow: 0 50px 130px rgba(0, 0, 0, 0.95);
      width: 100%;
    }

    /* Removed inner frames for a cleaner poster look */

    .hero-title {
      font-size: 1.7rem;         /* ~30% smaller than before */
      margin: 0 0 40px;
      font-family: "IM Fell English SC", "IM Fell English", serif;
      letter-spacing: 0.22em;    /* a touch more tracking to compensate */
      text-transform: uppercase;
      display: inline-block;
      padding: 10px 22px 12px;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0, rgba(0,0,0,0.95) 75%);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow:
        0 16px 40px rgba(0, 0, 0, 0.95),
        0 0 50px rgba(255,255,255,0.06);
    }

    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 14px;                /* more gap between buttons */
      max-width: 420px;
      margin: 0 auto;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      background: none;
      color: var(--fg);
      text-decoration: none;
      font-family: "IM Fell English SC", "IM Fell English", serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
    }

    .btn-primary {
      background: linear-gradient(135deg, #f0c674, #d9a85a);
      color: #000;
      border-color: #d9a85a;
    }

    .btn-primary:hover { filter: brightness(1.05); }

    .btn-secondary {
      border-color: var(--border);
      background: rgba(0, 0, 0, 0.8);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .btn-outline {
      border-color: var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
    }

    footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 2px solid var(--border-strong);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 720px) {
      body {
        padding: 24px 0;
      }

      .page {
        margin: 0 8px;
        padding: 32px 14px 40px;
      }

      .masthead {
        margin-bottom: 32px;
      }

      .hero-poster {
        padding: 56px 18px 56px;
      }

      .hero-title {
        font-size: 1.5rem;
        margin-bottom: 32px;
      }

      .hero-actions {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="content-inner">

      <!-- Masthead -->
      <div class="masthead">
        <div class="masthead-line-1">
          UNITED STATES POLO PATRONS ASSOCIATION
        </div>
        <div class="masthead-rule"></div>
        <div class="masthead-line-2">
          OFFICIAL STEWARDSHIP TOKEN
        </div>
      </div>

      <!-- Hero -->
      <header>
        <div class="hero-poster">
          <h1 class="hero-title">POLO PATRONIUM (PATRON)</h1>

          <div class="hero-actions">
            <!-- TODO: replace hrefs with real Thirdweb/Base URLs -->
            <a class="btn btn-primary" href="#buy-fiat">
              BUY PATRON (FIAT VIA THIRDWEB)
            </a>
            <a class="btn btn-secondary" href="#buy-crypto">
              BUY PATRON (CRYPTO ON BASE)
            </a>
            <a class="btn btn-outline" href="#founding-patrons">
              APPLY TO BE A FOUNDING PATRON
            </a>
          </div>
        </div>
      </header>

      <!-- Footer -->
      <footer>
        <div>
          &copy; <span id="year"></span> US Polo Patrons Association &mdash; Polo Patronium (PATRON).
        </div>
        <div>
          Built on Base &middot; string 7̶7̶7̶ remuda
        </div>
      </footer>

    </div>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
