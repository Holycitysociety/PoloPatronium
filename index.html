<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Polo Patronium — Official Patronage Token of the USPPA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Slim Garamond-style fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #050505;
      --fg: #f5f5f5;
      --muted: #a7a7a7;
      --accent: #e3bf72;
      --border: #2b2b2b;

      --font-lg: clamp(2.1rem, 5vw, 2.7rem);
      --font-md: clamp(1.1rem, 3.2vw, 1.4rem);
      --font-sm: 0.85rem;

      --block-gap: 56px;
      --block-gap-sm: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,0.07) 0, rgba(0,0,0,0.95) 40%),
        radial-gradient(circle at 50% 65%, rgba(255,255,255,0.05) 0, rgba(0,0,0,0.98) 55%),
        var(--bg);
      color: var(--fg);
      font-family: "EB Garamond", Georgia, "Times New Roman", serif;
      font-size: var(--font-md);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }

    .page {
      max-width: 820px;
      margin: 48px auto 96px;
      padding: 0 12px;
    }

    /* Masthead */
    .masthead {
      text-align: center;
      padding: 4px 0 0;
      margin-bottom: var(--block-gap);
    }

    .masthead-inner {
      max-width: 100%;
      margin: 0 auto;
    }

    .masthead-line-1 {
      font-family: "Cormorant Garamond", "EB Garamond", serif;
      text-transform: uppercase;
      font-size: var(--font-md);
      letter-spacing: 0.12em;
      color: #e0e0e0;
      line-height: 1.28;
    }

    .masthead-line-1 span {
      display: block;
    }

    .masthead-line-1 span:last-child {
      font-size: 0.86em;
      letter-spacing: 0.14em;
    }

    .masthead-rule {
      margin: 26px auto;
      width: 100%;
      border-top: 1px solid var(--border);
    }

    .masthead-line-2 {
      font-family: "Cormorant Garamond", "EB Garamond", serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: var(--font-sm);
      color: #f0f0f0;
      font-weight: 500;
      margin-top: 4px;
      margin-bottom: 4px;
    }

    .masthead-stewardship {
      font-size: var(--font-sm);
      max-width: 640px;
      margin: 6px auto 0;
      line-height: 1.6;
    }

    /* Hero */
    header {
      padding: 0;
      text-align: center;
    }

    .hero-title {
      font-family: "Cormorant Garamond", "EB Garamond", serif;
      text-transform: uppercase;
      font-size: var(--font-lg);
      letter-spacing: 0.18em;
      margin: 0 0 14px;
    }

    /* token info block */
    .hero-symbol {
      font-family: "Cormorant Garamond", serif;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: var(--font-sm);
      margin-bottom: var(--block-gap);
    }

    .hero-symbol-main {
      margin-bottom: 6px;
      color: var(--fg);
      font-weight: 500;
    }

    .hero-network {
      font-size: var(--font-sm);
      letter-spacing: 0.16em;
      color: var(--fg);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .hero-contract {
      font-size: var(--font-sm);
      letter-spacing: 0.16em;
      color: var(--fg);
      font-weight: 500;
    }

    .hero-contract-label {
      opacity: 0.9;
    }

    .hero-contract-value {
      font-family: "EB Garamond", Georgia, serif;
      font-size: 0.9em;
      letter-spacing: 0.04em;
      margin-left: 0.35em;
    }

    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 26px;
      max-width: 460px;
      margin: 0 auto var(--block-gap);
      align-items: center;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 10px 28px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: var(--font-sm);
      font-family: "Cormorant Garamond", "EB Garamond", serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
      min-width: 220px;
      max-width: 260px;
      margin: 0 auto;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      box-shadow: 0 10px 24px rgba(0,0,0,0.55);
    }

    .btn-primary:hover {
      background: #f1cf86;
      border-color: #f1cf86;
      transform: translateY(-1px);
      box-shadow: 0 14px 32px rgba(0,0,0,0.7);
    }

    .btn-outline {
      color: var(--muted);
      border-color: #555;
    }

    .btn-outline:hover {
      background: #181818;
      color: var(--fg);
      border-color: #777;
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- Masthead ... (unchanged) -->

    <header>
      <h1 class="hero-title">POLO PATRONIUM</h1>

      <div class="hero-symbol">
        <div class="hero-symbol-main">
          ERC-777 &middot;TOKEN SYMBOL "PATRON"
        </div>
        <div class="hero-network">
          ON BASE NETWORK BY COINBASE
        </div>
        <div class="hero-contract">
          <span class="hero-contract-label">CA:</span>
          <span class="hero-contract-value">0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913</span>
        </div>
      </div>

      <div class="hero-actions">
        
        <!-- REPLACED OLD LINK WITH REAL BUTTON -->
        <button id="buyPatronBtn" class="btn btn-primary">
          BUY PATRON
        </button>

        <a class="btn btn-outline" href="#founding-patrons">
          FOUNDING PATRON INQUIRIES
        </a>
      </div>
    </header>

    <!-- Rest of page unchanged… -->
  </div>

  <!-- YEAR FOOTER SCRIPT -->
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

  <!-- 🔥 THIRDWEB CHECKOUT POPUP SCRIPT -->
  <script src="https://cdn.thirdweb.com/js/checkout/latest/dist/checkout.umd.js"></script>

  <script>
    const widget = new CheckoutWidget.Checkout({
      clientId: "YOUR_CLIENT_ID_HERE",  // ← replace this

      mode: "direct",
      chain: "base",

      tokenAddress: "0x128445CAAB304A9203CCb87D06dD888823749FbE",
      receiverAddress: "0xFEE3C75691E8C10eD4246b10635B19bfFf06Ce16",

      price: {
        currency: "USD",
        amount: 0.10
      },

      ui: {
        theme: "dark",
        title: "Buy PATRON",
        description: "Purchase instantly with card, ACH, or crypto"
      }
    });

    document.getElementById("buyPatronBtn").addEventListener("click", () => {
      widget.open();
    });
  </script>

</body>
</html>
