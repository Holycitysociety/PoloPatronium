<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>
      Patronium — Official Society Patronage Token
    </title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Patronium is the official Society patronage token and utility layer of the Patrons Society."
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=EB+Garamond:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-deep: #041221;
        --bg: #07192b;
        --bg-mid: #0c2238;
        --bg-light: #142b43;

        --fg: #f5f7f8;
        --fg-soft: #e4e9ee;
        --muted: #aab7c5;
        --muted-dark: #8190a1;

        --accent: #e5c273;
        --accent-light: #f2d891;
        --accent-mid: #d8ae58;
        --accent-soft: #c9b083;
        --accent-muted: #a98b56;

        --border: #263f59;
        --border-soft: rgba(135, 172, 205, 0.22);
        --border-warm: rgba(203, 164, 90, 0.42);

        --font-large: clamp(2.15rem, 5vw, 2.75rem);
        --font-medium: clamp(1rem, 2.6vw, 1.18rem);
        --font-small: 0.82rem;

        --section-gap: 52px;
        --content-gap: 25px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        overflow-x: hidden;
        background: var(--bg-deep);
      }

      body {
        min-width: 0;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(
            ellipse at 50% -8%,
            rgba(174, 211, 240, 0.17) 0%,
            rgba(80, 127, 169, 0.08) 27%,
            transparent 54%
          ),
          radial-gradient(
            ellipse at 50% 58%,
            rgba(77, 124, 164, 0.08) 0%,
            transparent 56%
          ),
          linear-gradient(
            180deg,
            var(--bg-light) 0%,
            var(--bg-mid) 38%,
            var(--bg) 72%,
            var(--bg-deep) 100%
          );
        color: var(--fg);
        font-family:
          "EB Garamond",
          Georgia,
          "Times New Roman",
          serif;
        font-size: var(--font-medium);
        font-weight: 400;
        line-height: 1.52;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        position: fixed;
        z-index: -1;
        top: 0;
        right: 0;
        left: 0;
        height: 240px;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.035),
            transparent
          );
        content: "";
        pointer-events: none;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      .page {
        width: min(calc(100% - 24px), 820px);
        margin: 28px auto 96px;
      }

      /* Buttons */

      .btn {
        display: inline-flex;
        width: auto;
        min-width: 220px;
        max-width: 270px;
        margin: 0 auto;
        padding: 10px 28px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.025),
            rgba(255, 255, 255, 0)
          ),
          rgba(6, 22, 38, 0.3);
        color: var(--fg);
        cursor: pointer;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: var(--font-small);
        font-weight: 500;
        letter-spacing: 0.16em;
        line-height: 1.25;
        text-align: center;
        text-transform: uppercase;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.045),
          0 10px 20px rgba(0, 0, 0, 0.12);
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease,
          box-shadow 0.15s ease,
          transform 0.15s ease;
      }

      .btn-primary {
        border-color: var(--accent-light);
        background:
          linear-gradient(
            180deg,
            #f1d58f 0%,
            #e7c573 48%,
            #d8ae58 100%
          );
        color: #100c05;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.42),
          inset 0 -1px 0 rgba(91, 60, 10, 0.28),
          0 12px 26px rgba(0, 0, 0, 0.3);
      }

      .btn-primary:hover {
        border-color: #f5dea2;
        background:
          linear-gradient(
            180deg,
            #f6dfa0 0%,
            #eccb79 48%,
            #dfb661 100%
          );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.48),
          inset 0 -1px 0 rgba(91, 60, 10, 0.24),
          0 15px 32px rgba(0, 0, 0, 0.35);
        transform: translateY(-1px);
      }

      .btn-outline {
        border-color: rgba(134, 161, 190, 0.58);
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.025),
            rgba(255, 255, 255, 0)
          ),
          rgba(10, 31, 51, 0.3);
        color: #abb8c6;
      }

      .btn-outline:hover {
        border-color: rgba(166, 192, 218, 0.78);
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.045),
            rgba(255, 255, 255, 0.005)
          ),
          rgba(19, 47, 74, 0.62);
        color: var(--fg);
      }

      /* Wallet utility */

      .wallet-header {
        display: flex;
        padding: 6px 0 38px;
        align-items: center;
        justify-content: center;
      }

      .wallet-button {
        width: auto;
        min-width: 178px;
        max-width: 200px;
        margin: 0;
        padding: 8px 24px;
        font-size: 0.76rem;
        letter-spacing: 0.15em;
      }

      /* Society masthead */

      .masthead {
        margin-bottom: 46px;
        text-align: center;
      }

      .masthead-inner {
        display: flex;
        width: 100%;
        align-items: center;
        flex-direction: column;
      }

      .institutional-latin {
        max-width: 100%;
        margin-bottom: 9px;
        padding-inline: 12px;
        color: var(--accent-soft);
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: 0.65rem;
        font-weight: 400;
        letter-spacing: 0.22em;
        line-height: 1.45;
        text-transform: uppercase;
      }

      .masthead-presents {
        color: #e3e8ed;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: 0.69rem;
        font-weight: 500;
        letter-spacing: 0.25em;
        line-height: 1.35;
        text-transform: uppercase;
      }

      .patrons-wordmark {
        display: flex;
        width: 100%;
        margin: 20px 0 36px;
        align-items: center;
        justify-content: center;
      }

      .patrons-title {
        display: block;
        max-width: 100%;
        padding-inline: 8px;
        white-space: nowrap;
        background:
          linear-gradient(
            180deg,
            #fff8e6 0%,
            #efd8a8 34%,
            #dcb96f 66%,
            #f5dfad 100%
          );
        background-clip: text;
        color: transparent;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          Garamond,
          serif;
        font-size: clamp(2.05rem, 5.9vw, 2.72rem);
        font-weight: 300;
        letter-spacing: 0.155em;
        line-height: 1.02;
        text-shadow:
          0 1px 0 rgba(255, 255, 255, 0.1),
          0 9px 24px rgba(0, 0, 0, 0.3);
        text-transform: uppercase;
        -webkit-background-clip: text;
      }

      .masthead-rule {
        width: 100%;
        margin: 0 auto 25px;
        border-top: 1px solid var(--border-soft);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.015);
      }

      .masthead-introducing {
        margin-bottom: 3px;
        color: #cbd4dd;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: 0.65rem;
        font-weight: 500;
        letter-spacing: 0.22em;
        line-height: 1.4;
        text-transform: uppercase;
      }

      .masthead-token-line {
        max-width: 640px;
        padding-inline: 12px;
        color: #e8edf1;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: 0.76rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        line-height: 1.45;
        text-transform: uppercase;
      }

      /* Patronium hero */

      .hero-header {
        padding: 0;
        text-align: center;
      }

      .hero-title {
        margin: 0 0 12px;
        color: var(--fg);
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: clamp(2.05rem, 5.2vw, 2.5rem);
        font-weight: 500;
        letter-spacing: 0.15em;
        line-height: 1;
        text-shadow:
          0 1px 0 rgba(255, 255, 255, 0.04),
          0 12px 28px rgba(0, 0, 0, 0.22);
        text-transform: uppercase;
      }

      .hero-definition {
        max-width: 535px;
        margin: 0 auto 23px;
        padding-inline: 14px;
        color: var(--accent-soft);
        font-size: 0.88rem;
        letter-spacing: 0.015em;
        line-height: 1.48;
      }

      .hero-symbol {
        margin-bottom: 43px;
        padding-inline: 8px;
        color: #e5ebf0;
        font-family:
          "Cormorant Garamond",
          serif;
        font-size: 0.76rem;
        font-weight: 500;
        letter-spacing: 0.13em;
        line-height: 1.52;
        text-transform: uppercase;
      }

      .hero-symbol-main {
        margin-bottom: 4px;
      }

      .hero-network {
        margin-bottom: 3px;
        font-size: inherit;
        letter-spacing: 0.12em;
      }

      .hero-contract {
        display: flex;
        max-width: 100%;
        justify-content: center;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        overflow-wrap: anywhere;
      }

      .hero-contract-label {
        flex: 0 0 auto;
        opacity: 0.9;
      }

      .hero-contract-value {
        min-width: 0;
        margin-left: 0.35em;
        font-family:
          "EB Garamond",
          Georgia,
          serif;
        font-size: 0.92em;
        letter-spacing: 0.012em;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .hero-actions {
        display: flex;
        max-width: 460px;
        margin: 0 auto var(--section-gap);
        align-items: center;
        flex-direction: column;
        gap: 22px;
      }

      /* Main content */

      main {
        margin-top: var(--section-gap);
      }

      .brand-row {
        position: relative;
        overflow: hidden;
        padding: 34px 12px 42px;
        border: 1px solid rgba(112, 151, 188, 0.12);
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.028) 0%,
            rgba(255, 255, 255, 0.008) 16%,
            rgba(255, 255, 255, 0) 42%
          ),
          radial-gradient(
            ellipse at 50% 0%,
            rgba(120, 171, 215, 0.1) 0%,
            rgba(41, 80, 116, 0.05) 34%,
            transparent 67%
          ),
          linear-gradient(
            180deg,
            rgba(22, 52, 82, 0.84),
            rgba(11, 33, 56, 0.78)
          );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.045),
          0 18px 42px rgba(0, 0, 0, 0.12);
      }

      .brand-row::before {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 1px;
        background:
          linear-gradient(
            90deg,
            transparent,
            rgba(184, 216, 241, 0.2),
            transparent
          );
        content: "";
      }

      .roadmap-heading {
        margin-bottom: 32px;
        text-align: center;
      }

      .roadmap-kicker {
        margin-bottom: 3px;
        color: var(--accent-muted);
        font-size: 0.62rem;
        font-weight: 500;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }

      .roadmap-main-title {
        color: #f3f5f6;
        font-family:
          "Cormorant Garamond",
          serif;
        font-size: 1.12rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .roadmap-heading-rule {
        width: 80px;
        height: 1px;
        margin: 10px auto 0;
        background:
          linear-gradient(
            90deg,
            transparent,
            var(--accent-muted),
            transparent
          );
        opacity: 0.72;
      }

      .brand-grid {
        display: grid;
        max-width: 100%;
        margin: 20px auto 0;
        grid-template-columns: 1fr;
        gap: 38px;
      }

      .logo-block {
        max-width: 94%;
        margin: 0 auto;
        padding: 7px 4px;
        text-align: center;
      }

      .initiative-text {
        max-width: 720px;
        margin: 12px auto 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.52;
        text-align: justify;
        text-justify: inter-word;
      }

      .roadmap-footnote {
        max-width: 720px;
        margin: 30px auto 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.52;
        text-align: justify;
        text-justify: inter-word;
      }

      /* Stringpool */

      .logo-usp-string-remuda {
        display: block;
        color: var(--fg);
        font-family:
          "Cormorant Garamond",
          serif;
        text-align: center;
      }

      .stringpool-wordmark-inner {
        max-width: 560px;
        margin: 0 auto;
      }

      .stringpool-rule {
        height: 1px;
        margin-bottom: 15px;
        background:
          linear-gradient(
            90deg,
            transparent,
            var(--accent-light),
            transparent
          );
        opacity: 0.88;
      }

      .stringpool-rule-lower {
        margin-top: 15px;
        margin-bottom: 13px;
      }

      .stringpool-prefix {
        color: var(--accent-soft);
        font-size: 0.86rem;
        letter-spacing: 0.13em;
        line-height: 1.4;
      }

      .stringpool-name {
        color: #f3f5f6;
        font-size: 1.32rem;
        font-weight: 500;
        letter-spacing: 0.21em;
        line-height: 1.2;
        text-shadow: 0 8px 18px rgba(0, 0, 0, 0.16);
        text-transform: uppercase;
      }

      /* Cowboy Polo */

      .logo-cowboy-polo-circuit {
        color: #f3f5f6;
        font-family:
          "Cormorant Garamond",
          serif;
        font-size: 1.08rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .logo-cowboy-polo-circuit span {
        display: inline-block;
        padding: 8px 24px;
        border: 1px solid var(--accent-light);
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.025),
            rgba(255, 255, 255, 0)
          );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.04),
          0 10px 20px rgba(0, 0, 0, 0.1);
      }

      /* Polo Way */

      .logo-the-polo-way {
        color: var(--fg);
        font-family:
          "Cormorant Garamond",
          serif;
      }

      .logo-the-polo-way .top {
        display: block;
        margin-bottom: 2px;
        color: var(--accent-soft);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .logo-the-polo-way .main {
        display: block;
        font-size: clamp(1.9rem, 4.8vw, 2.45rem);
        font-weight: 500;
        letter-spacing: 0.105em;
        line-height: 1.05;
        text-shadow: 0 10px 22px rgba(0, 0, 0, 0.16);
        text-transform: uppercase;
      }

      /* Charleston Polo */

      .logo-charleston-polo {
        font-family:
          "Cormorant Garamond",
          serif;
        font-size: 1.05rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .logo-charleston-polo .top {
        display: block;
        margin-bottom: 2px;
        color: var(--accent-soft);
        font-size: 0.72rem;
      }

      .logo-charleston-polo .main {
        display: inline-block;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--accent-light);
      }

      /* Copy */

      .copy-section {
        max-width: 680px;
        margin: var(--section-gap) auto 0;
        padding-top: 30px;
        border-top: 1px solid var(--border-soft);
        color: var(--muted);
        font-size: 0.84rem;
      }

      .copy-section-title {
        margin-bottom: 27px;
        color: #e9edf1;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: 0.74rem;
        font-weight: 500;
        letter-spacing: 0.17em;
        text-align: center;
        text-transform: uppercase;
      }

      .copy-section-inner {
        position: relative;
        margin-top: 8px;
      }

      .copy-block {
        margin-bottom: var(--content-gap);
      }

      .copy-block h2 {
        margin: 0 0 10px;
        color: #eef2f5;
        font-family:
          "Cormorant Garamond",
          serif;
        font-size: 0.98rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        line-height: 1.34;
        text-transform: uppercase;
      }

      .copy-block p {
        margin: 0 0 12px;
        line-height: 1.52;
        text-align: justify;
        text-justify: inter-word;
      }

      .copy-lead {
        color: #d5c19a;
        font-size: 1em;
      }

      /* Horse card */

      .horse-card-wrap {
        display: flex;
        margin: 19px 0 23px;
        justify-content: center;
      }

      .horse-card {
        position: relative;
        width: 100%;
        max-width: 340px;
        overflow: hidden;
        padding: 14px;
        border: 1px solid var(--border-warm);
        border-radius: 18px;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.035),
            rgba(255, 255, 255, 0.006) 24%,
            rgba(255, 255, 255, 0) 50%
          ),
          radial-gradient(
            ellipse at 50% 0%,
            rgba(133, 177, 215, 0.11),
            transparent 52%
          ),
          linear-gradient(
            180deg,
            #182b3c,
            #0d2032
          );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.055),
          inset 0 -1px 0 rgba(0, 0, 0, 0.28),
          0 17px 38px rgba(0, 0, 0, 0.22);
      }

      .horse-card::before {
        position: absolute;
        top: 0;
        right: 18px;
        left: 18px;
        height: 1px;
        background:
          linear-gradient(
            90deg,
            transparent,
            rgba(240, 218, 166, 0.28),
            transparent
          );
        content: "";
      }

      .horse-card-heading {
        margin-bottom: 12px;
        color: var(--accent-soft);
        font-size: 0.59rem;
        font-weight: 500;
        letter-spacing: 0.24em;
        text-align: center;
        text-transform: uppercase;
      }

      .horse-card-display {
        display: flex;
        min-height: 180px;
        margin-bottom: 12px;
        overflow: hidden;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(199, 176, 138, 0.28);
        border-radius: 12px;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.025),
            rgba(255, 255, 255, 0)
          ),
          radial-gradient(
            ellipse at 50% 0%,
            rgba(150, 188, 221, 0.12),
            rgba(20, 48, 74, 0.14) 44%,
            rgba(6, 20, 34, 0.34) 100%
          );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.035),
          inset 0 -10px 24px rgba(0, 0, 0, 0.08);
      }

      .horse-card-display-inner {
        padding: 20px 14px;
        text-align: center;
      }

      .horse-card-kicker {
        margin-bottom: 10px;
        color: var(--accent-soft);
        font-size: 0.64rem;
        font-weight: 500;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .horse-card-name {
        margin-bottom: 10px;
        color: #f3f5f6;
        font-size: 1.48rem;
        font-weight: 500;
        letter-spacing: 0.13em;
        line-height: 1.08;
        text-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        text-transform: uppercase;
      }

      .horse-card-record {
        color: var(--accent-muted);
        font-size: 0.58rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .horse-card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .horse-card-standard-label {
        margin-bottom: 4px;
        color: var(--accent-muted);
        font-size: 0.54rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .horse-card-standard {
        color: #edf1f4;
        font-size: 0.82rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .horse-card-badge {
        display: inline-flex;
        padding: 6px 14px 5px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--accent-light);
        border-radius: 999px;
        background:
          linear-gradient(
            180deg,
            #efd493,
            #c99e4a
          );
        color: #181108;
        font-size: 0.58rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        white-space: nowrap;
        text-transform: uppercase;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.36),
