<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Polo Patronium (PATRON) — Stewardship Token of the USPPA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Woodcut-style serif fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=IM+Fell+English+SC&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #050505;
      --bg-inner: #111111;
      --fg: #f5f5f5;
      --muted: #b5b5b5;
      --accent: #d9a85a; /* soft gold accent */
      --border: #3a3a3a;
      --border-strong: #77716a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #202020 0, #050505 55%);
      color: var(--fg);
      font-family: "IM Fell English", Georgia, "Times New Roman", serif;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 0;
    }

    .page {
      max-width: 720px;              /* narrower = more portrait */
      width: 100%;
      margin: 0 12px;
      padding: 32px 22px 36px;       /* a bit more vertical padding */
      background: var(--bg-inner);
      border: 2px solid var(--border-strong);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.85);
      position: relative;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(150, 150, 150, 0.2);
      pointer-events: none;
    }

    .content-inner {
      position: relative;
      z-index: 1;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    /* Masthead */
    .masthead {
      margin-bottom: 24px;
      text-align: center;
    }

    .masthead-line-1 {
      font-family: "IM Fell English SC", "IM Fell English", serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .masthead-rule {
      margin: 8px auto 10px;
      width: 70%;
      border-top: 2px solid var(--border-strong);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      height: 5px;
    }

    .masthead-line-2 {
      font-family: "IM Fell English SC", "IM Fell English", serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.82rem;
      color: var(--fg);
    }

    header { margin-bottom: 24px; }

    .hero-poster {
      padding: 40px 22px 40px;       /* taller hero box */
      margin-top: 6px;
      border-radius: 0;
      border: 2px solid var(--border-strong);
      background: radial-gradient(circle at top, #232323 0, #101010 60%);
      text-align: center;
      position: relative;
      box-shadow: 0 26px 80px rgba(0, 0, 0, 0.9);
    }

    .hero-poster::before,
    .hero-poster::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(0, 0, 0, 0.7);
      inset: 6px;
      pointer-events: none;
    }

    .hero-poster::after {
      border-color: rgba(255, 255, 255, 0.06);
      inset: 9px;
    }

    .hero-title {
      font-size: 2.4rem;
      margin: 0 0 32px;              /* more space below title */
      font-family: "IM Fell English SC", "IM Fell English", serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      display: inline-block;
      padding: 8px 20px 10px;
      background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0, rgba(0,0,0,0.9) 70%);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.9),
        0 0 40px rgba(255,255,255,0.05);
    }

    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;                    /* slightly bigger gaps */
      max-width: 420px;
      margin: 0 auto;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      background: none;
      color: var(--fg);
      text-decoration: none;
      font-family: "IM Fell English SC", "IM Fell English", serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.85);
    }

    .btn-primary {
      background: linear-gradient(135deg, #f0c674, #d9a85a);
      color: #000;
      border-color: #d9a85a;
    }

    .btn-primary:hover { filter: brightness(1.05); }

    .btn-secondary {
      border-color: var(--border);
      background: rgba(0, 0, 0, 0.7);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .btn-outline {
      border-color: var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8);
    }

    footer {
      margin-top: 8px;
      padding-top: 10px;
      border-top: 2px solid var(--border-strong);
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 720px) {
      body {
        align-items: flex-start;
        padding: 16px 0;
      }

      .page {
        margin: 0 8px;
        padding: 24px 14px 28px;
      }

      .hero-title {
        font-size: 2rem;
        margin-bottom: 24px;
      }

      .hero-actions {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="content-inner">

      <!-- Masthead -->
      <div class="masthead">
        <div class="masthead-line-1">
          UNITED STATES POLO PATRONS ASSOCIATION
        </div>
        <div class="masthead-rule"></div>
        <div class="masthead-line-2">
          OFFICIAL STEWARDSHIP TOKEN
        </div>
      </div>

      <!-- Hero -->
      <header>
        <div class="hero-poster">
          <h1 class="hero-title">POLO PATRONIUM (PATRON)</h1>

          <div class="hero-actions">
            <!-- TODO: replace hrefs with real Thirdweb/Base URLs -->
            <a class="btn btn-primary" href="#buy-fiat">
              BUY PATRON (FIAT VIA THIRDWEB)
            </a>
            <a class="btn btn-secondary" href="#buy-crypto">
              BUY PATRON (CRYPTO ON BASE)
            </a>
            <a class="btn btn-outline" href="#founding-patrons">
              APPLY TO BE A FOUNDING PATRON
            </a>
          </div>
        </div>
      </header>

      <!-- Footer -->
      <footer>
        <div>
          &copy; <span id="year"></span> US Polo Patrons Association &mdash; Polo Patronium (PATRON).
        </div>
        <div>
          Built on Base &middot; string 7̶7̶7̶ remuda
        </div>
      </footer>

    </div>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
