<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>
      Patronium — Official Society Patronage Token
    </title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Patronium is the official Society patronage token and utility layer of the Patrons Society."
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=EB+Garamond:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #050505;
        --fg: #f5f5f5;
        --muted: #a7a7a7;
        --accent: #e3bf72;
        --accent-light: #f1d694;
        --accent-soft: #c7b08a;
        --accent-muted: #9f8a64;
        --border: #2b2b2b;
        --border-warm: #3a2b16;

        --font-large: clamp(2.2rem, 5vw, 2.8rem);
        --font-medium: clamp(1.08rem, 3vw, 1.35rem);
        --font-small: 0.85rem;

        --section-gap: 56px;
        --content-gap: 24px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        overflow-x: hidden;
        background: var(--bg);
      }

      body {
        min-width: 0;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(
            circle at 50% 0%,
            rgba(255, 255, 255, 0.07) 0,
            rgba(0, 0, 0, 0.95) 40%
          ),
          radial-gradient(
            circle at 50% 65%,
            rgba(255, 255, 255, 0.05) 0,
            rgba(0, 0, 0, 0.98) 55%
          ),
          var(--bg);
        color: var(--fg);
        font-family:
          "EB Garamond",
          Georgia,
          "Times New Roman",
          serif;
        font-size: var(--font-medium);
        line-height: 1.6;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      .page {
        width: min(calc(100% - 24px), 820px);
        margin: 28px auto 96px;
      }

      /* Buttons */

      .btn {
        display: inline-flex;
        width: auto;
        min-width: 220px;
        max-width: 270px;
        margin: 0 auto;
        padding: 10px 28px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: var(--font-small);
        font-weight: 500;
        letter-spacing: 0.16em;
        line-height: 1.3;
        text-align: center;
        text-transform: uppercase;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease,
          box-shadow 0.15s ease,
          transform 0.15s ease;
      }

      .btn-primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #090704;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55);
      }

      .btn-primary:hover {
        border-color: var(--accent-light);
        background: var(--accent-light);
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.7);
        transform: translateY(-1px);
      }

      .btn-outline {
        border-color: #555;
        color: var(--muted);
      }

      .btn-outline:hover {
        border-color: #777;
        background: #181818;
        color: var(--fg);
      }

      /* Wallet utility */

      .wallet-header {
        display: flex;
        padding: 6px 0 38px;
        align-items: center;
        justify-content: center;
      }

      .wallet-button {
        width: auto;
        min-width: 178px;
        max-width: 200px;
        margin: 0;
        padding: 8px 24px;
        font-size: 0.78rem;
        letter-spacing: 0.15em;
      }

      /* Society masthead */

      .masthead {
        margin-bottom: 48px;
        text-align: center;
      }

      .masthead-inner {
        display: flex;
        width: 100%;
        align-items: center;
        flex-direction: column;
      }

      .institutional-latin {
        max-width: 100%;
        margin-bottom: 10px;
        padding-inline: 12px;
        color: var(--accent-soft);
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: 0.69rem;
        font-weight: 400;
        letter-spacing: 0.23em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      .masthead-presents {
        color: #eeeeee;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: 0.8rem;
        font-weight: 500;
        letter-spacing: 0.27em;
        line-height: 1.4;
        text-transform: uppercase;
      }

      .patrons-wordmark {
        display: flex;
        width: 100%;
        margin: 22px 0 40px;
        align-items: center;
        justify-content: center;
      }

      .patrons-title {
        display: block;
        max-width: 100%;
        padding-inline: 8px;
        white-space: nowrap;
        background:
          linear-gradient(
            to bottom,
            #f8f0db 0%,
            #ebd7ad 40%,
            #d6b777 72%,
            #f3e2bc 100%
          );
        background-clip: text;
        color: transparent;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          Garamond,
          serif;
        font-size: clamp(2.1rem, 6.1vw, 2.8rem);
        font-weight: 300;
        letter-spacing: 0.16em;
        line-height: 1.04;
        text-shadow:
          0 0 0.5px rgba(227, 191, 114, 0.18),
          0 8px 24px rgba(0, 0, 0, 0.48);
        text-transform: uppercase;
        -webkit-background-clip: text;
      }

      .masthead-rule {
        width: 100%;
        margin: 0 auto 28px;
        border-top: 1px solid var(--border);
      }

      .masthead-introducing {
        margin-bottom: 4px;
        color: #eeeeee;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: 0.76rem;
        font-weight: 500;
        letter-spacing: 0.24em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      .masthead-token-line {
        max-width: 640px;
        padding-inline: 12px;
        color: #f4f4f4;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: 0.88rem;
        font-weight: 500;
        letter-spacing: 0.21em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      /* Patronium hero */

      .hero-header {
        padding: 0;
        text-align: center;
      }

      .hero-title {
        margin: 0 0 14px;
        color: var(--fg);
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: clamp(2.25rem, 5.6vw, 2.7rem);
        font-weight: 500;
        letter-spacing: 0.17em;
        line-height: 1.05;
        text-transform: uppercase;
      }

      .hero-definition {
        max-width: 570px;
        margin: 0 auto 25px;
        padding-inline: 14px;
        color: var(--accent-soft);
        font-size: 0.91rem;
        letter-spacing: 0.025em;
        line-height: 1.55;
      }

      .hero-symbol {
        margin-bottom: 46px;
        padding-inline: 8px;
        font-family:
          "Cormorant Garamond",
          serif;
        font-size: var(--font-small);
        letter-spacing: 0.16em;
        line-height: 1.6;
        text-transform: uppercase;
      }

      .hero-symbol-main {
        margin-bottom: 5px;
        color: var(--fg);
        font-weight: 500;
      }

      .hero-network {
        margin-bottom: 4px;
        color: var(--fg);
        font-size: var(--font-small);
        font-weight: 500;
        letter-spacing: 0.14em;
      }

      .hero-contract {
        display: flex;
        max-width: 100%;
        justify-content: center;
        color: var(--fg);
        font-size: var(--font-small);
        font-weight: 500;
        letter-spacing: 0.08em;
        overflow-wrap: anywhere;
      }

      .hero-contract-label {
        flex: 0 0 auto;
        opacity: 0.9;
      }

      .hero-contract-value {
        min-width: 0;
        margin-left: 0.35em;
        font-family:
          "EB Garamond",
          Georgia,
          serif;
        font-size: 0.88em;
        letter-spacing: 0.025em;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .hero-actions {
        display: flex;
        max-width: 460px;
        margin: 0 auto var(--section-gap);
        align-items: center;
        flex-direction: column;
        gap: 22px;
      }

      /* Main content */

      main {
        margin-top: var(--section-gap);
      }

      .brand-row {
        padding: 34px 0 40px;
        border-top: 1px solid var(--border);
        background:
          radial-gradient(
            circle at top,
            rgba(255, 255, 255, 0.06) 0,
            transparent 60%
          );
      }

      .roadmap-heading {
        margin-bottom: 34px;
        text-align: center;
      }

      .roadmap-kicker {
        margin-bottom: 4px;
        color: var(--accent-muted);
        font-size: 0.68rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      .roadmap-main-title {
        color: #f5eedc;
        font-family:
          "Cormorant Garamond",
          serif;
        font-size: 1.22rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .roadmap-heading-rule {
        width: 80px;
        height: 1px;
        margin: 10px auto 0;
        background: var(--border-warm);
        opacity: 0.9;
      }

      .brand-grid {
        display: grid;
        max-width: 100%;
        margin: 22px auto 0;
        grid-template-columns: 1fr;
        gap: 44px;
      }

      .logo-block {
        max-width: 90%;
        margin: 0 auto;
        padding: 8px 4px;
        text-align: center;
      }

      .initiative-text {
        max-width: 720px;
        margin: 12px auto 0;
        color: var(--muted);
        font-size: var(--font-small);
        text-align: justify;
        text-justify: inter-word;
      }

      .roadmap-footnote {
        max-width: 720px;
        margin: 32px auto 0;
        color: var(--muted);
        font-size: var(--font-small);
        text-align: justify;
        text-justify: inter-word;
      }

      /* Stringpool */

      .logo-usp-string-remuda {
        display: block;
        color: var(--fg);
        font-family:
          "Cormorant Garamond",
          serif;
        text-align: center;
      }

      .stringpool-wordmark-inner {
        max-width: 560px;
        margin: 0 auto;
      }

      .stringpool-rule {
        height: 1px;
        margin-bottom: 16px;
        background: var(--accent-soft);
        opacity: 0.9;
      }

      .stringpool-rule-lower {
        margin-top: 16px;
        margin-bottom: 14px;
      }

      .stringpool-prefix {
        color: var(--accent-soft);
        font-size: 0.94rem;
        letter-spacing: 0.15em;
        line-height: 1.45;
      }

      .stringpool-name {
        color: #f5eedc;
        font-size: 1.5rem;
        letter-spacing: 0.24em;
        line-height: 1.25;
        text-transform: uppercase;
      }

      /* Cowboy Polo */

      .logo-cowboy-polo-circuit {
        color: #f5eedc;
        font-family:
          "Cormorant Garamond",
          serif;
        font-size: var(--font-medium);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .logo-cowboy-polo-circuit span {
        display: inline-block;
        padding: 8px 28px;
        border: 1px solid var(--accent-soft);
      }

      /* Polo Way */

      .logo-the-polo-way {
        color: var(--fg);
        font-family:
          "Cormorant Garamond",
          serif;
      }

      .logo-the-polo-way .top {
        display: block;
        margin-bottom: 2px;
        color: var(--accent-soft);
        font-size: var(--font-small);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .logo-the-polo-way .main {
        display: block;
        font-size: var(--font-large);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      /* Charleston Polo */

      .logo-charleston-polo {
        font-family:
          "Cormorant Garamond",
          serif;
        font-size: var(--font-medium);
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .logo-charleston-polo .top {
        display: block;
        margin-bottom: 2px;
        color: var(--accent-soft);
        font-size: var(--font-small);
      }

      .logo-charleston-polo .main {
        display: inline-block;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--accent-soft);
      }

      /* Copy */

      .copy-section {
        max-width: 680px;
        margin: var(--section-gap) auto 0;
        padding-top: 32px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: var(--font-small);
      }

      .copy-section-title {
        margin-bottom: 28px;
        color: #f0f0f0;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: 0.82rem;
        letter-spacing: 0.18em;
        text-align: center;
        text-transform: uppercase;
      }

      .copy-section-inner {
        position: relative;
        margin-top: 8px;
      }

      .copy-block {
        margin-bottom: var(--content-gap);
      }

      .copy-block h2 {
        margin: 0 0 9px;
        color: #f5f5f5;
        font-family:
          "Cormorant Garamond",
          serif;
        font-size: 1.03rem;
        font-weight: 500;
        letter-spacing: 0.07em;
        line-height: 1.4;
        text-transform: uppercase;
      }

      .copy-block p {
        margin: 0 0 10px;
        text-align: justify;
        text-justify: inter-word;
      }

      .copy-lead {
        color: #d2c2a5;
        font-size: 1.03em;
      }

      /* Horse card */

      .horse-card-wrap {
        display: flex;
        margin: 18px 0 22px;
        justify-content: center;
      }

      .horse-card {
        width: 100%;
        max-width: 340px;
        padding: 14px;
        border: 1px solid var(--border-warm);
        border-radius: 18px;
        background:
          linear-gradient(
            180deg,
            rgba(199, 176, 138, 0.1),
            rgba(0, 0, 0, 0.22)
          ),
          #050505;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.36);
      }

      .horse-card-heading {
        margin-bottom: 12px;
        color: var(--accent-soft);
        font-size: 0.63rem;
        letter-spacing: 0.28em;
        text-align: center;
        text-transform: uppercase;
      }

      .horse-card-display {
        display: flex;
        min-height: 180px;
        margin-bottom: 12px;
        overflow: hidden;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(199, 176, 138, 0.25);
        border-radius: 12px;
        background:
          radial-gradient(
            circle at top,
            rgba(227, 191, 114, 0.1),
            rgba(0, 0, 0, 0.1) 45%,
            rgba(0, 0, 0, 0.25) 100%
          );
      }

      .horse-card-display-inner {
        padding: 20px 14px;
        text-align: center;
      }

      .horse-card-kicker {
        margin-bottom: 10px;
        color: var(--accent-soft);
        font-size: 0.69rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .horse-card-name {
        margin-bottom: 10px;
        color: #f5eedc;
        font-size: 1.63rem;
        letter-spacing: 0.14em;
        line-height: 1.1;
        text-transform: uppercase;
      }

      .horse-card-record {
        color: var(--accent-muted);
        font-size: 0.63rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .horse-card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .horse-card-standard-label {
        margin-bottom: 4px;
        color: var(--accent-muted);
        font-size: 0.56rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .horse-card-standard {
        color: #f5eedc;
        font-size: 0.88rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .horse-card-badge {
        display: inline-flex;
        padding: 6px 14px 5px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--accent-soft);
        border-radius: 999px;
        background:
          linear-gradient(
            180deg,
            #e3bf72,
            #b89047
          );
        color: #181210;
        font-size: 0.63rem;
        letter-spacing: 0.18em;
        white-space: nowrap;
        text-transform: uppercase;
      }

      /* Footer */

      footer {
        display: flex;
        margin-top: var(--section-gap);
        padding: 18px 0 10px;
        align-items: center;
        flex-direction: column;
        gap: 4px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: var(--font-small);
        text-align: center;
        text-transform: uppercase;
      }

      /* Mobile */

      @media (max-width: 600px) {
        :root {
          --font-large: clamp(2rem, 10vw, 2.5rem);
          --font-medium: clamp(1rem, 4.8vw, 1.2rem);
          --font-small: 0.78rem;

          --section-gap: 40px;
          --content-gap: 22px;
        }

        .page {
          width: min(calc(100% - 20px), 820px);
          margin-top: 18px;
          margin-bottom: 72px;
        }

        .wallet-header {
          padding: 4px 0 34px;
        }

        .btn {
          width: min(74%, 280px);
          min-width: 0;
          max-width: 280px;
          padding: 9px 20px;
          font-size: 0.76rem;
          letter-spacing: 0.14em;
        }

        .wallet-button {
          width: 184px;
          min-width: 184px;
          max-width: 184px;
          padding: 8px 18px;
          font-size: 0.72rem;
          letter-spacing: 0.14em;
        }

        .masthead {
          margin-bottom: 42px;
        }

        .institutional-latin {
          max-width: 320px;
          margin-bottom: 10px;
          padding-inline: 8px;
          font-size: 0.64rem;
          letter-spacing: 0.17em;
          line-height: 1.5;
        }

        .masthead-presents {
          font-size: 0.73rem;
          letter-spacing: 0.25em;
        }

        .patrons-wordmark {
          margin: 20px 0 32px;
        }

        .patrons-title {
          width: 100%;
          padding-inline: 4px;
          font-size: clamp(1.47rem, 7.5vw, 1.95rem);
          letter-spacing: 0.095em;
          line-height: 1.04;
        }

        .masthead-rule {
          margin-bottom: 21px;
        }

        .masthead-introducing {
          margin-bottom: 3px;
          font-size: 0.69rem;
          letter-spacing: 0.2em;
        }

        .masthead-token-line {
          max-width: 330px;
          padding-inline: 8px;
          font-size: 0.76rem;
          letter-spacing: 0.15em;
          line-height: 1.5;
        }

        .hero-title {
          margin-bottom: 13px;
          font-size: clamp(2.08rem, 10.3vw, 2.5rem);
          letter-spacing: 0.11em;
        }

        .hero-definition {
          max-width: 335px;
          margin-bottom: 23px;
          padding-inline: 12px;
          font-size: 0.83rem;
          line-height: 1.5;
        }

        .hero-symbol {
          margin-bottom: 42px;
          padding-inline: 4px;
          font-size: 0.7rem;
          letter-spacing: 0.1em;
          line-height: 1.55;
        }

        .hero-symbol-main {
          margin-bottom: 5px;
        }

        .hero-network {
          font-size: 0.7rem;
          letter-spacing: 0.1em;
        }

        .hero-contract {
          display: block;
          font-size: 0.66rem;
          letter-spacing: 0.04em;
          line-height: 1.45;
        }

        .hero-contract-label,
        .hero-contract-value {
          display: inline;
        }

        .hero-contract-value {
          margin-left: 0.25em;
          font-size: 0.92em;
          letter-spacing: 0.015em;
          overflow-wrap: anywhere;
          word-break: break-all;
        }

        .hero-actions {
          max-width: 100%;
          margin-bottom: 42px;
          gap: 22px;
        }

        main {
          margin-top: 40px;
        }

        .brand-row {
          padding-top: 28px;
          padding-bottom: 34px;
        }

        .roadmap-heading {
          margin-bottom: 30px;
        }

        .roadmap-kicker {
          font-size: 0.63rem;
          letter-spacing: 0.24em;
        }

        .roadmap-main-title {
          font-size: 1.12rem;
          letter-spacing: 0.18em;
        }

        .brand-grid {
          gap: 38px;
        }

        .logo-block {
          max-width: 100%;
          padding-inline: 6px;
        }

        .stringpool-prefix {
          font-size: 0.88rem;
          letter-spacing: 0.11em;
        }

        .stringpool-name {
          font-size: 1.25rem;
          letter-spacing: 0.16em;
        }

        .logo-cowboy-polo-circuit {
          font-size: 1rem;
          letter-spacing: 0.12em;
        }

        .logo-cowboy-polo-circuit span {
          max-width: 100%;
          padding: 8px 16px;
        }

        .logo-the-polo-way .main {
          font-size: clamp(1.9rem, 10vw, 2.4rem);
          letter-spacing: 0.09em;
        }

        .logo-charleston-polo {
          font-size: 1.02rem;
          letter-spacing: 0.15em;
        }

        .initiative-text,
        .roadmap-footnote,
        .copy-block p {
          text-align: left;
          text-justify: auto;
        }

        .copy-section {
          padding: 28px 8px 0;
        }

        .copy-section-title {
          margin-bottom: 24px;
