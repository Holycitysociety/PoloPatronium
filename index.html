<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>
      Patronium — Official Society Patronage Token
    </title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=EB+Garamond:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #050505;
        --fg: #f5f5f5;
        --muted: #a7a7a7;
        --accent: #e3bf72;
        --accent-soft: #c7b08a;
        --accent-muted: #9f8a64;
        --border: #2b2b2b;
        --border-warm: #3a2b16;

        --font-lg: clamp(2.1rem, 5vw, 2.7rem);
        --font-md: clamp(1.1rem, 3.2vw, 1.4rem);
        --font-sm: 0.85rem;

        --block-gap: 56px;
        --block-gap-sm: 24px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        overflow-x: hidden;
      }

      body {
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(
            circle at 50% 0%,
            rgba(255, 255, 255, 0.07) 0,
            rgba(0, 0, 0, 0.95) 40%
          ),
          radial-gradient(
            circle at 50% 65%,
            rgba(255, 255, 255, 0.05) 0,
            rgba(0, 0, 0, 0.98) 55%
          ),
          var(--bg);
        color: var(--fg);
        font-family:
          "EB Garamond",
          Georgia,
          "Times New Roman",
          serif;
        font-size: var(--font-md);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: none;
      }

      .page {
        width: min(calc(100% - 24px), 820px);
        margin: 34px auto 96px;
      }

      /* Wallet */

      .wallet-header {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px 0 30px;
        text-align: center;
      }

      /* Masthead */

      .masthead {
        margin-bottom: var(--block-gap);
        padding: 4px 0 0;
        text-align: center;
      }

      .masthead-inner {
        display: flex;
        max-width: 100%;
        margin: 0 auto;
        align-items: center;
        flex-direction: column;
      }

      .institutional-latin {
        max-width: 100%;
        margin-bottom: 12px;
        padding-inline: 12px;
        color: var(--accent-soft);
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: 0.72rem;
        font-weight: 400;
        letter-spacing: 0.24em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      .patrons-wordmark {
        display: flex;
        width: 100%;
        margin: 16px 0 42px;
        align-items: center;
        flex-direction: column;
        text-align: center;
        text-transform: uppercase;
      }

      .patrons-title {
        display: block;
        max-width: 100%;
        padding-inline: 10px;
        white-space: nowrap;
        background:
          linear-gradient(
            to bottom,
            #f8f0db 0%,
            #ebd7ad 40%,
            #d6b777 72%,
            #f3e2bc 100%
          );
        background-clip: text;
        color: transparent;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          Garamond,
          serif;
        font-size: clamp(1.65rem, 6vw, 2.42rem);
        font-weight: 300;
        letter-spacing: 0.18em;
        line-height: 1.05;
        text-shadow:
          0 0 0.5px rgba(227, 191, 114, 0.18),
          0 8px 24px rgba(0, 0, 0, 0.48);
        text-transform: uppercase;
        -webkit-background-clip: text;
      }

      .masthead-rule {
        width: 100%;
        margin: 0 auto 25px;
        border-top: 1px solid var(--border);
      }

      .masthead-line-2 {
        color: #f0f0f0;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: var(--font-sm);
        font-weight: 500;
        letter-spacing: 0.2em;
        line-height: 1.5;
        text-transform: uppercase;
      }

      .masthead-presents {
        margin: 0;
      }

      .masthead-introducing {
        margin: 0 0 4px;
      }

      .masthead-stewardship {
        max-width: 640px;
        margin: 0 auto;
        padding-inline: 12px;
        line-height: 1.6;
      }

      /* Hero */

      .hero-header {
        padding: 0;
        text-align: center;
      }

      .hero-title {
        margin: 0 0 14px;
        color: var(--fg);
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: var(--font-lg);
        font-weight: 500;
        letter-spacing: 0.18em;
        line-height: 1.1;
        text-transform: uppercase;
      }

      .hero-symbol {
        margin-bottom: var(--block-gap);
        padding-inline: 8px;
        font-family:
          "Cormorant Garamond",
          serif;
        font-size: var(--font-sm);
        letter-spacing: 0.2em;
        line-height: 1.6;
        text-transform: uppercase;
      }

      .hero-symbol-main {
        margin-bottom: 6px;
        color: var(--fg);
        font-weight: 500;
      }

      .hero-network {
        margin-bottom: 4px;
        color: var(--fg);
        font-size: var(--font-sm);
        font-weight: 500;
        letter-spacing: 0.16em;
      }

      .hero-contract {
        display: flex;
        max-width: 100%;
        justify-content: center;
        color: var(--fg);
        font-size: var(--font-sm);
        font-weight: 500;
        letter-spacing: 0.16em;
        overflow-wrap: anywhere;
      }

      .hero-contract-label {
        flex: 0 0 auto;
        opacity: 0.9;
      }

      .hero-contract-value {
        min-width: 0;
        margin-left: 0.35em;
        font-family:
          "EB Garamond",
          Georgia,
          serif;
        font-size: 0.9em;
        letter-spacing: 0.04em;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .hero-actions {
        display: flex;
        max-width: 460px;
        margin: 0 auto var(--block-gap);
        align-items: center;
        flex-direction: column;
        gap: 26px;
      }

      /* Buttons */

      .btn {
        display: inline-flex;
        width: auto;
        min-width: 220px;
        max-width: 260px;
        margin: 0 auto;
        padding: 10px 28px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: var(--font-sm);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease,
          box-shadow 0.15s ease,
          transform 0.15s ease;
      }

      .btn-primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #000;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55);
      }

      .btn-primary:hover {
        border-color: #f1cf86;
        background: #f1cf86;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.7);
        transform: translateY(-1px);
      }

      .btn-outline {
        border-color: #555;
        color: var(--muted);
      }

      .btn-outline:hover {
        border-color: #777;
        background: #181818;
        color: var(--fg);
      }

      /*
        Compact utility button.
        This comes after the general .btn rule so the
        base button minimum width cannot override it.
      */

      .btn.wallet-button {
        width: auto;
        min-width: 0;
        max-width: none;
        margin: 0;
        padding: 8px 30px;
      }

      /* Main */

      main {
        margin-top: var(--block-gap);
      }

      /* Roadmap */

      .brand-row {
        padding-top: 32px;
        padding-bottom: 40px;
        border-top: 1px solid var(--border);
        background:
          radial-gradient(
            circle at top,
            rgba(255, 255, 255, 0.06) 0,
            transparent 60%
          );
      }

      .roadmap-heading {
        margin-bottom: 34px;
        text-align: center;
      }

      .roadmap-kicker {
        margin-bottom: 4px;
        color: var(--accent-muted);
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      .roadmap-main-title {
        color: #f5eedc;
        font-size: 20px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .roadmap-heading-rule {
        width: 80px;
        height: 1px;
        margin: 10px auto 0;
        background: var(--border-warm);
        opacity: 0.9;
      }

      .brand-grid {
        display: grid;
        max-width: 100%;
        margin: 22px auto 0;
        grid-template-columns: 1fr;
        gap: 44px;
      }

      .logo-block {
        max-width: 90%;
        margin: 0 auto;
        padding: 8px 4px;
        text-align: center;
      }

      .initiative-text {
        max-width: 720px;
        margin: 12px auto 0;
        color: var(--muted);
        font-size: var(--font-sm);
        text-align: justify;
        text-justify: inter-word;
      }

      .roadmap-footnote {
        max-width: 720px;
        margin: 32px auto 0;
        color: var(--muted);
        font-size: var(--font-sm);
        text-align: justify;
        text-justify: inter-word;
      }

      /* Stringpool wordmark */

      .logo-usp-string-remuda {
        display: block;
        color: var(--fg);
        font-family:
          "Cormorant Garamond",
          serif;
        text-align: center;
      }

      .stringpool-wordmark-inner {
        max-width: 560px;
        margin: 0 auto;
      }

      .stringpool-rule {
        height: 1px;
        margin-bottom: 16px;
        background: var(--accent-soft);
        opacity: 0.9;
      }

      .stringpool-rule-lower {
        margin-top: 16px;
        margin-bottom: 14px;
      }

      .stringpool-prefix {
        color: var(--accent-soft);
        font-size: 15px;
        letter-spacing: 0.15em;
        line-height: 1.45;
      }

      .stringpool-name {
        color: #f5eedc;
        font-size: 24px;
        letter-spacing: 0.24em;
        line-height: 1.25;
        text-transform: uppercase;
      }

      /* Cowboy Polo */

      .logo-cowboy-polo-circuit {
        color: #f5eedc;
        font-family:
          "Cormorant Garamond",
          serif;
        font-size: var(--font-md);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .logo-cowboy-polo-circuit span {
        display: inline-block;
        padding: 8px 28px;
        border: 1px solid var(--accent-soft);
      }

      /* Polo Way */

      .logo-the-polo-way {
        color: var(--fg);
        font-family:
          "Cormorant Garamond",
          serif;
      }

      .logo-the-polo-way .top {
        display: block;
        margin-bottom: 2px;
        color: var(--accent-soft);
        font-size: var(--font-sm);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .logo-the-polo-way .main {
        display: block;
        font-size: var(--font-lg);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      /* Charleston Polo */

      .logo-charleston-polo {
        font-family:
          "Cormorant Garamond",
          serif;
        font-size: var(--font-md);
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .logo-charleston-polo .top {
        display: block;
        margin-bottom: 2px;
        color: var(--accent-soft);
        font-size: var(--font-sm);
      }

      .logo-charleston-polo .main {
        display: inline-block;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--accent-soft);
      }

      /* Copy sections */

      .copy-section {
        max-width: 680px;
        margin: var(--block-gap) auto 0;
        padding-top: 32px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: var(--font-sm);
      }

      .copy-section-title {
        margin-bottom: 24px;
        color: #f0f0f0;
        font-family:
          "Cormorant Garamond",
          "EB Garamond",
          serif;
        font-size: var(--font-sm);
        letter-spacing: 0.18em;
        text-align: center;
        text-transform: uppercase;
      }

      .copy-section-inner {
        position: relative;
        margin-top: 8px;
      }

      .copy-block {
        margin-bottom: var(--block-gap-sm);
      }

      .copy-block h3 {
        margin: 0 0 8px;
        color: #f5f5f5;
        font-family:
          "Cormorant Garamond",
          serif;
        font-size: 1.02rem;
        letter-spacing: 0.08em;
        line-height: 1.4;
        text-transform: uppercase;
      }

      .copy-block p {
        margin: 0 0 10px;
        text-align: justify;
        text-justify: inter-word;
      }

      .copy-block ul {
        margin: 6px 0 0 18px;
        padding: 0;
      }

      .copy-block li {
        margin-bottom: 4px;
        text-align: justify;
        text-justify: inter-word;
      }

      /* Horse card */

      .horse-card-wrap {
        display: flex;
        margin: 18px 0 22px;
        justify-content: center;
      }

      .horse-card {
        width: 100%;
        max-width: 340px;
        padding: 14px;
        border: 1px solid var(--border-warm);
        border-radius: 18px;
        background:
          linear-gradient(
            180deg,
            rgba(199, 176, 138, 0.1),
            rgba(0, 0, 0, 0.22)
          ),
          #050505;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.36);
      }

      .horse-card-heading {
        margin-bottom: 12px;
        color: var(--accent-soft);
        font-size: 10px;
        letter-spacing: 0.28em;
        text-align: center;
        text-transform: uppercase;
      }

      .horse-card-display {
        position: relative;
        display: flex;
        min-height: 180px;
        margin-bottom: 12px;
        overflow: hidden;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(199, 176, 138, 0.25);
        border-radius: 12px;
        background:
          radial-gradient(
            circle at top,
            rgba(227, 191, 114, 0.1),
            rgba(0, 0, 0, 0.1) 45%,
            rgba(0, 0, 0, 0.25) 100%
          );
      }

      .horse-card-display-inner {
        padding: 20px 14px;
        text-align: center;
      }

      .horse-card-kicker {
        margin-bottom: 10px;
        color: var(--accent-soft);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .horse-card-name {
        margin-bottom: 10px;
        color: #f5eedc;
        font-size: 26px;
        letter-spacing: 0.14em;
        line-height: 1.1;
        text-transform: uppercase;
      }

      .horse-card-record {
        color: var(--accent-muted);
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .horse-card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .horse-card-standard-label {
        margin-bottom: 4px;
        color: var(--accent-muted);
        font-size: 9px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .horse-card-standard {
        color: #f5eedc;
        font-size: 14px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .horse-card-badge {
        display: inline-flex;
        padding: 6px 14px 5px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--accent-soft);
        border-radius: 999px;
        background:
          linear-gradient(
            180deg,
            #e3bf72,
            #b89047
          );
        color: #181210;
        font-size: 10px;
        letter-spacing: 0.18em;
        white-space: nowrap;
        text-transform: uppercase;
      }

      /* Footer */

      footer {
        display: flex;
        margin-top: var(--block-gap);
        padding: 18px 0 10px;
        align-items: center;
        flex-direction: column;
        gap: 4px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: var(--font-sm);
        text-align: center;
        text-transform: uppercase;
      }

      /* Mobile */

      @media (max-width: 600px) {
        :root {
          --font-lg: clamp(2rem, 10.5vw, 2.55rem);
          --font-md: clamp(1rem, 4.8vw, 1.22rem);
          --font-sm: 0.78rem;

          --block-gap: 38px;
          --block-gap-sm: 22px;
        }

        .page {
          width: min(calc(100% - 20px), 820px);
          margin-top: 18px;
          margin-bottom: 72px;
        }

        .wallet-header {
          padding: 4px 0 30px;
        }

        /*
          Keep Patron Wallet narrow on mobile.
          The general .btn mobile width does not apply to it.
        */

        .btn.wallet-button {
          width: auto;
          min-width: 0;
          max-width: none;
          padding: 7px 26px;
        }

        .masthead {
          margin-bottom: 42px;
          padding-top: 0;
        }

        .institutional-latin {
          max-width: 310px;
          margin-bottom: 10px;
          padding-inline: 8px;
          font-size: 0.66rem;
          letter-spacing: 0.17em;
          line-height: 1.5;
        }

        .masthead-line-2 {
          font-size: 0.72rem;
          letter-spacing: 0.17em;
        }

        .masthead-presents {
          margin-top: 1px;
        }

        .patrons-wordmark {
          margin-top: 15px;
          margin-bottom: 30px;
        }

        .patrons-title {
          width: 100%;
          padding-inline: 4px;
          font-size: clamp(1.45rem, 7.6vw, 1.95rem);
          letter-spacing: 0.095em;
          line-height: 1.04;
          white-space: nowrap;
        }

        .masthead-rule {
          margin-bottom: 20px;
        }

        .masthead-introducing {
          margin-bottom: 3px;
        }

        .masthead-stewardship {
          max-width: 310px;
          padding-inline: 8px;
          font-size: 0.7rem;
          letter-spacing: 0.14em;
          line-height: 1.5;
        }

        .hero-title {
          margin-bottom: 12px;
          font-size: clamp(2rem, 11vw, 2.6rem);
          letter-spacing: 0.11em;
        }

        .hero-symbol {
          margin-bottom: 42px;
          padding-inline: 4px;
          font-size: 0.72rem;
          letter-spacing: 0.12em;
          line-height: 1.55;
        }

        .hero-symbol-main {
          margin-bottom: 5px;
        }

        .hero-network {
          font-size: 0.72rem;
          letter-spacing: 0.11em;
        }

        .hero-contract {
          display: block;
          font-size: 0.68rem;
          letter-spacing: 0.08em;
          line-height: 1.45;
        }

        .hero-contract-label {
          display: inline;
        }

        .hero-contract-value {
          display: inline;
          margin-left: 0.25em;
          font-size: 0.92em;
          letter-spacing: 0.025em;
          overflow-wrap: anywhere;
          word-break: break-all;
        }

        .hero-actions {
          max-width: 100%;
          margin-bottom: 42px;
          gap: 22px;
        }

        /*
          Broad transactional buttons only.
          Patron Wallet is excluded by the more specific rule above.
        */

        .hero-actions .btn {
          width: min(74%, 280px);
          min-width: 0;
          max-width: 280px;
          padding: 9px 20px;
          font-size: 0.76rem;
          letter-spacing: 0.14em;
        }

        main {
          margin-top: 38px;
        }

        .brand-row {
          padding-top: 28px;
          padding-bottom: 34px;
        }

        .roadmap-heading {
          margin-bottom: 30px;
        }

        .roadmap-kicker {
          font-size: 10px;
          letter-spacing: 0.24em;
        }

        .roadmap-main-title {
          font-size: 18px;
          letter-spacing: 0.18em;
        }

        .brand-grid {
          gap: 38px;
        }

        .logo-block {
          max-width: 100%;
          padding-inline: 6px;
        }

        .stringpool-prefix {
          font-size: 14px;
          letter-spacing: 0.11em;
        }

        .stringpool-name {
          font-size: 20px;
          letter-spacing: 0.16em;
        }

        .logo-cowboy-polo-circuit {
          font-size: 1rem;
          letter-spacing: 0.12em;
        }

        .logo-cowboy-polo-circuit span {
          max-width: 100%;
          padding: 8px 16px;
        }

        .logo-the-polo-way .main {
          font-size: clamp(1.9rem, 10vw, 2.4rem);
          letter-spacing: 0.09em;
        }

        .logo-charleston-polo {
          font-size: 1.02rem;
          letter-spacing: 0.15em;
        }

        .initiative-text,
        .roadmap-footnote,
        .copy-block p,
        .copy-block li {
          text-align: left;
          text-justify: auto;
        }

        .copy-section {
          padding: 28px 8px 0;
        }

        .copy-section-title {
          margin-bottom: 22px;
          font-size: 0.76rem;
          letter-spacing: 0.15em;
        }

        .copy-block h3 {
          font-size: 0.96rem;
          letter-spacing: 0.06em;
          line-height: 1.35;
        }

        .horse-card {
          max-width: 330px;
        }

        .horse-card-heading {
          letter-spacing: 0.2em;
        }

        footer {
          margin-top: 42px;
          padding-bottom: 32px;
          font-size: 0.72rem;
          letter-spacing: 0.06em;
        }
      }

      /* Narrow mobile */

      @media (max-width: 380px) {
        .page {
          width: min(calc(100% - 16px), 820px);
        }

        .institutional-latin {
          max-width: 290px;
          font-size: 0.62rem;
