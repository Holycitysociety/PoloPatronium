<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Polo Patronium — Official Patronage Token of the USPPA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Slim Garamond-style fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* === YOUR ORIGINAL CSS UNCHANGED === */
      :root {
        --bg: #050505;
        --fg: #f5f5f5;
        --muted: #a7a7a7;
        --accent: #e3bf72;
        --border: #2b2b2b;

        --font-lg: clamp(2.1rem, 5vw, 2.7rem);
        --font-md: clamp(1.1rem, 3.2vw, 1.4rem);
        --font-sm: 0.85rem;

        --block-gap: 56px;
        --block-gap-sm: 24px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.07) 0, rgba(0, 0, 0, 0.95) 40%),
          radial-gradient(circle at 50% 65%, rgba(255, 255, 255, 0.05) 0, rgba(0, 0, 0, 0.98) 55%),
          var(--bg);
        color: var(--fg);
        font-family: "EB Garamond", Georgia, "Times New Roman", serif;
        font-size: var(--font-md);
        line-height: 1.6;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      .page {
        max-width: 820px;
        margin: 48px auto 96px;
        padding: 0 12px;
      }

      .masthead {
        text-align: center;
        padding: 4px 0 0;
        margin-bottom: var(--block-gap);
      }

      .masthead-inner {
        max-width: 100%;
        margin: 0 auto;
      }

      .masthead-line-1 {
        font-family: "Cormorant Garamond", "EB Garamond", serif;
        text-transform: uppercase;
        font-size: var(--font-md);
        letter-spacing: 0.12em;
        color: #e0e0e0;
        line-height: 1.28;
      }

      .masthead-line-1 span {
        display: block;
      }

      .masthead-line-1 span:last-child {
        font-size: 0.86em;
        letter-spacing: 0.14em;
      }

      .masthead-rule {
        margin: 26px auto;
        width: 100%;
        border-top: 1px solid var(--border);
      }

      .masthead-line-2 {
        font-family: "Cormorant Garamond", "EB Garamond", serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-size: var(--font-sm);
        color: #f0f0f0;
        font-weight: 500;
        margin-top: 4px;
        margin-bottom: 4px;
      }

      .masthead-stewardship {
        font-size: var(--font-sm);
        max-width: 640px;
        margin: 6px auto 0;
        line-height: 1.6;
      }

      header {
        padding: 0;
        text-align: center;
      }

      .hero-title {
        font-family: "Cormorant Garamond", "EB Garamond", serif;
        text-transform: uppercase;
        font-size: var(--font-lg);
        letter-spacing: 0.18em;
        margin: 0 0 14px;
      }

      .hero-symbol {
        font-family: "Cormorant Garamond", serif;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: var(--font-sm);
        margin-bottom: var(--block-gap);
      }

      .hero-symbol-main {
        margin-bottom: 6px;
        color: var(--fg);
        font-weight: 500;
      }

      .hero-network {
        font-size: var(--font-sm);
        letter-spacing: 0.16em;
        color: var(--fg);
        font-weight: 500;
        margin-bottom: 4px;
      }

      .hero-contract {
        font-size: var(--font-sm);
        letter-spacing: 0.16em;
        color: var(--fg);
        font-weight: 500;
      }

      .hero-contract-label {
        opacity: 0.9;
      }

      .hero-contract-value {
        font-family: "EB Garamond", Georgia, serif;
        font-size: 0.9em;
        letter-spacing: 0.04em;
        margin-left: 0.35em;
      }

      .hero-actions {
        display: flex;
        flex-direction: column;
        gap: 26px;
        max-width: 460px;
        margin: 0 auto var(--block-gap);
        align-items: center;
      }

      .btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        padding: 10px 28px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: var(--font-sm);
        font-family: "Cormorant Garamond", "EB Garamond", serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease,
          color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        min-width: 220px;
        max-width: 260px;
        margin: 0 auto;
      }

      .btn-primary {
        background: var(--accent);
        color: #000;
        border-color: var(--accent);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55);
      }

      .btn-primary:hover {
        background: #f1cf86;
        border-color: #f1cf86;
        transform: translateY(-1px);
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.7);
      }

      .btn-outline {
        color: var(--muted);
        border-color: #555;
      }

      .btn-outline:hover {
        background: #181818;
        color: var(--fg);
        border-color: #777;
      }

      main {
        margin-top: var(--block-gap);
      }

      .brand-row {
        padding-top: 32px;
        padding-bottom: 40px;
        border-top: 1px solid var(--border);
        background: radial-gradient(circle at top, rgba(255, 255, 255, 0.06) 0, transparent 60%);
      }

      .brand-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 44px;
        margin-top: 22px;
        max-width: 100%;
        margin-left: auto;
        margin-right: auto;
      }

      .logo-block {
        text-align: center;
        padding: 8px 4px;
        max-width: 90%;
        margin: 0 auto;
      }

      .roadmap-title {
        text-align: center;
        text-transform: uppercase;
        font-family: "Cormorant Garamond", "EB Garamond", serif;
        letter-spacing: 0.18em;
        font-size: var(--font-sm);
        color: var(--muted);
        margin-top: 10px;
      }

      .logo-block .initiative-text {
        margin-top: 12px;
        font-size: var(--font-sm);
        color: var(--muted);
        max-width: 720px;
        margin-left: auto;
        margin-right: auto;
        text-align: justify;
        text-justify: inter-word;
      }

      .roadmap-footnote {
        margin-top: 32px;
        font-size: var(--font-sm);
        color: var(--muted);
        text-align: justify;
        text-justify: inter-word;
        max-width: 720px;
        margin-left: auto;
        margin-right: auto;
      }

      .logo-usp-string-remuda {
        font-family: "IM Fell English SC", "Cormorant Garamond", serif;
        text-transform: uppercase;
        color: var(--fg);
        display: inline-flex;
        flex-direction: column;
        align-items: center;
      }

      .logo-usp-string-remuda .usp {
        display: block;
        font-size: var(--font-sm);
        letter-spacing: 0.22em;
        margin-bottom: 6px;
      }

      .logo-usp-string-remuda .rule {
        width: 70%;
        max-width: 260px;
        margin: 0 auto 4px;
        border-top: 0.5px solid var(--fg);
        opacity: 0.9;
      }

      .logo-usp-string-remuda .string-line {
        display: inline-flex;
        align-items: flex-start;
        gap: 0.55em;
        line-height: 1;
        font-size: var(--font-md);
      }

      .logo-usp-string-remuda .string-word {
        letter-spacing: 0.24em;
      }

      .logo-usp-string-remuda .sevens {
        font-size: 1.45em;
        letter-spacing: 0.08em;
        line-height: 1;
      }

      .logo-cowboy-polo-circuit {
        text-transform: uppercase;
        font-family: "IM Fell English SC", "Cormorant Garamond", serif;
        letter-spacing: 0.18em;
        font-size: var(--font-md);
      }

      .logo-cowboy-polo-circuit span {
        display: inline-block;
        padding: 8px 28px;
        border: 1px solid var(--fg);
      }

      .logo-the-polo-life {
        font-family: "Cormorant Garamond", serif;
        color: var(--fg);
      }

      .logo-the-polo-life .top {
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: var(--font-sm);
        color: var(--muted);
        display: block;
        margin-bottom: 2px;
      }

      .logo-the-polo-life .main {
        display: block;
        font-size: var(--font-lg);
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .logo-charleston-polo {
        font-family: "Cormorant Garamond", serif;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: var(--font-md);
      }

      .logo-charleston-polo .top {
        display: block;
        font-size: var(--font-sm);
        color: var(--muted);
        margin-bottom: 2px;
      }

      .logo-charleston-polo .main {
        display: inline-block;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--fg);
      }

      .copy-section {
        margin-top: var(--block-gap);
        border-top: 1px solid var(--border);
        padding-top: 32px;
        max-width: 680px;
        margin-left: auto;
        margin-right: auto;
        font-size: var(--font-sm);
        color: var(--muted);
      }

      .copy-section-title {
        text-align: center;
        text-transform: uppercase;
        font-family: "Cormorant Garamond", "EB Garamond", serif;
        letter-spacing: 0.18em;
        font-size: var(--font-sm);
        color: #f0f0f0;
        margin-bottom: 24px;
      }

      .copy-block {
        margin-bottom: var(--block-gap-sm);
      }

      .copy-block h3 {
        margin: 0 0 8px;
        font-family: "Cormorant Garamond", serif;
        font-size: 1.02rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f5f5f5;
      }

      .copy-block p {
        margin: 0 0 10px;
        text-align: justify;
        text-justify: inter-word;
      }

      .copy-block ul {
        margin: 6px 0 0 18px;
        padding: 0;
      }

      .copy-block li {
        margin-bottom: 4px;
        text-align: justify;
        text-justify: inter-word;
      }

      footer {
        margin-top: var(--block-gap);
        padding: 18px 0 10px;
        border-top: 1px solid var(--border);
        font-size: var(--font-sm);
        color: var(--muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        text-align: center;
        text-transform: uppercase;
      }

      @media (max-width: 600px) {
        .page {
          margin-top: 40px;
          margin-bottom: 80px;
          padding: 0 10px;
        }

        .hero-actions {
          max-width: 100%;
        }

        .btn {
          min-width: 70%;
          max-width: 280px;
        }

        .copy-section {
          padding-left: 8px;
          padding-right: 8px;
        }

        footer {
          padding-bottom: 32px;
        }

        .logo-usp-string-remuda .string-line {
          flex-wrap: wrap;
          justify-content: center;
        }

        .logo-usp-string-remuda .string-word {
          font-size: 0.78rem;
          letter-spacing: 0.18em;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
